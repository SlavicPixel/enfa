services:

  # ── MongoDB (articles, prices, features) ──────────────────────────────
  mongodb:
    image: mongo:7
    container_name: finance_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - ./data/mongo:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (users/auth) ───────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: finance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Scheduler (data collection) ───────────────────────────────────────
  scheduler:
    build: ./scheduler
    container_name: finance_scheduler
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./model:/app/model        # shared model bundle
    depends_on:
      mongodb:
        condition: service_healthy